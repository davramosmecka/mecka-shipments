<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mecka Shipments</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e8eaf2;font-family:system-ui,sans-serif;min-height:100vh}
header{background:#181c27;border-bottom:1px solid #2a2f45;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:50}
.logo{font-weight:800;font-size:17px;letter-spacing:.05em}
.logo small{font-weight:400;color:#6b7194;font-size:12px;margin-left:8px}
.hc{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
button{cursor:pointer;font-family:inherit}
.nbtn{background:#1e2335;border:1px solid #2a2f45;color:#e8eaf2;width:32px;height:32px;border-radius:7px;font-size:18px;display:flex;align-items:center;justify-content:center}
.nbtn:hover{border-color:#4f6ef7}
#monthLabel{font-weight:700;font-size:15px;min-width:150px;text-align:center}
.abtn{background:#4f6ef7;border:none;color:#fff;padding:7px 16px;border-radius:7px;font-weight:600;font-size:13px}
.abtn:hover{opacity:.85}
.sync-status{font-size:11px;padding:4px 10px;border-radius:20px;font-weight:600}
.sync-ok{background:rgba(34,211,165,.13);color:#22d3a5}
.sync-err{background:rgba(244,63,94,.13);color:#f43f5e}
.sync-load{background:rgba(79,110,247,.13);color:#4f6ef7}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:8px 20px;background:#181c27;border-bottom:1px solid #2a2f45}
.li{display:flex;align-items:center;gap:5px;font-size:12px;color:#6b7194}
.ld{width:9px;height:9px;border-radius:50%}
.wrap{padding:16px 20px}
.dh{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dh div{text-align:center;font-size:11px;color:#6b7194;padding:5px 0;text-transform:uppercase;letter-spacing:.06em}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dc{background:#181c27;border:1px solid #2a2f45;border-radius:9px;min-height:105px;padding:7px 7px 5px;display:flex;flex-direction:column;gap:2px;cursor:pointer}
.dc:hover{border-color:#4f6ef7}
.dc.om{opacity:.25;pointer-events:none}
.dc.td{border-color:#4f6ef7;background:rgba(79,110,247,.06)}
.dn{font-size:11px;color:#6b7194;width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:1px}
.dc.td .dn{background:#4f6ef7;color:#fff;border-radius:50%}
.chip{border-radius:4px;padding:2px 6px;font-size:10px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:2px solid}
.chip:hover{opacity:.75}
.chip.production{background:rgba(249,115,22,.13);color:#f97316;border-color:#f97316}
.chip.shipment{background:rgba(34,211,165,.13);color:#22d3a5;border-color:#22d3a5}
.chip.purchasing{background:rgba(167,139,250,.13);color:#a78bfa;border-color:#a78bfa}
.chip.atrisk{background:rgba(244,63,94,.13);color:#f43f5e;border-color:#f43f5e}
.more{font-size:10px;color:#4f6ef7;padding:1px 3px;font-weight:600}
.more:hover{opacity:.75}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:#181c27;border:1px solid #2a2f45;border-radius:14px;padding:24px;width:100%;max-width:440px;position:relative}
.modal h2{font-size:16px;font-weight:700;margin-bottom:18px}
.mcl{position:absolute;top:14px;right:14px;background:#1e2335;border:1px solid #2a2f45;color:#6b7194;width:28px;height:28px;border-radius:7px;font-size:15px;display:flex;align-items:center;justify-content:center}
.mcl:hover{color:#e8eaf2}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;color:#6b7194;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
input,select,textarea{width:100%;background:#0f1117;border:1px solid #2a2f45;color:#e8eaf2;border-radius:7px;padding:9px 11px;font-family:inherit;font-size:13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4f6ef7}
select option{background:#1e2335}
textarea{resize:vertical;min-height:65px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ma{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;align-items:center}
.bcn{background:#1e2335;border:1px solid #2a2f45;color:#6b7194;padding:8px 16px;border-radius:7px;font-size:13px}
.bcn:hover{color:#e8eaf2}
.bsv{background:#4f6ef7;border:none;color:#fff;padding:8px 20px;border-radius:7px;font-weight:600;font-size:13px}
.bsv:hover{opacity:.85}
.bsv:disabled{opacity:.4;cursor:not-allowed}
.bdl{background:rgba(244,63,94,.13);border:1px solid #f43f5e;color:#f43f5e;padding:8px 14px;border-radius:7px;font-size:13px;margin-right:auto}
.bdl:hover{opacity:.8}
/* Day view */
.daymodal{background:#181c27;border:1px solid #2a2f45;border-radius:14px;padding:24px;width:100%;max-width:500px;position:relative;max-height:82vh;display:flex;flex-direction:column}
.daymodal h2{font-size:15px;font-weight:700;margin-bottom:3px}
.dsub{font-size:11px;color:#6b7194;margin-bottom:14px}
.dev-list{overflow-y:auto;display:flex;flex-direction:column;gap:7px;flex:1}
.dev-item{background:#0f1117;border:1px solid #2a2f45;border-radius:9px;padding:11px 13px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;transition:border-color .15s}
.dev-item:hover{border-color:#4f6ef7}
.dev-left{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.dev-title{font-weight:700;font-size:14px}
.dev-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.dev-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.dev-pill{font-size:10px;color:#6b7194;background:#1e2335;padding:2px 7px;border-radius:10px}
.dev-notes{font-size:11px;color:#6b7194;margin-top:2px}
.dev-arrow{color:#4f6ef7;font-size:16px;padding-top:1px}
.day-add-btn{margin-top:12px;background:#4f6ef7;border:none;color:#fff;padding:9px 16px;border-radius:7px;font-weight:600;font-size:13px;width:100%}
.day-add-btn:hover{opacity:.85}
/* Detail modal */
.dd{display:flex;flex-direction:column;gap:9px}
.dtag{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px}
.drow{display:flex;gap:7px;font-size:13px}
.dkey{color:#6b7194;font-size:11px;min-width:75px;padding-top:1px}
.dtitle{font-weight:700;font-size:19px;margin:4px 0 10px}
/* Loading overlay */
.loading-bar{position:fixed;top:0;left:0;height:2px;background:#4f6ef7;z-index:999;transition:width .3s;width:0}
@media(max-width:600px){
  .wrap{padding:10px}
  .dc{min-height:65px;padding:4px}
  .chip{font-size:9px;padding:1px 4px}
  .fr{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header>
  <div class="logo">MECKA <small>// shipment calendar</small></div>
  <div class="hc">
    <span class="sync-status sync-load" id="syncStatus">connecting...</span>
    <button class="nbtn" onclick="changeMonth(-1)">&#8249;</button>
    <div id="monthLabel"></div>
    <button class="nbtn" onclick="changeMonth(1)">&#8250;</button>
    <button class="abtn" onclick="openAdd()">+ Add Event</button>
  </div>
</header>

<div class="legend">
  <div class="li"><div class="ld" style="background:#f97316"></div>Ready for Shipment</div>
  <div class="li"><div class="ld" style="background:#22d3a5"></div>Shipment / Arrival</div>
  <div class="li"><div class="ld" style="background:#a78bfa"></div>Purchasing / PO</div>
  <div class="li"><div class="ld" style="background:#f43f5e"></div>At Risk / Delayed</div>
</div>

<div class="wrap">
  <div class="dh">
    <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div>
    <div>Thu</div><div>Fri</div><div>Sat</div>
  </div>
  <div id="grid"></div>
</div>

<!-- Day View Modal -->
<div class="ov" id="dayModal">
  <div class="daymodal">
    <button class="mcl" onclick="closeDayView()">&#10005;</button>
    <h2 id="dayTitle"></h2>
    <div class="dsub" id="daySubtitle"></div>
    <div class="dev-list" id="dayList"></div>
    <button class="day-add-btn" id="dayAddBtn">+ Add Event on This Day</button>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="ov" id="eModal">
  <div class="modal">
    <button class="mcl" onclick="closeModal()">&#10005;</button>
    <h2 id="eTitle">Add Event</h2>
    <div class="fr">
      <div class="fg">
        <label class="fl">Date</label>
        <input type="date" id="eDate">
      </div>
      <div class="fg">
        <label class="fl">Category</label>
        <select id="eCat">
          <option value="shipment">Shipment / Arrival</option>
          <option value="production">Ready for Shipment</option>
          <option value="purchasing">Purchasing / PO</option>
          <option value="atrisk">At Risk / Delayed</option>
        </select>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Title (shows on calendar)</label>
      <input type="text" id="eLabel" placeholder="e.g. 100 MC JKT">
    </div>
    <div class="fr">
      <div class="fg">
        <label class="fl">Hub</label>
        <select id="eHub">
          <option value="">All Hubs</option>
          <option value="MNL">Manila (MNL)</option>
          <option value="JKT">Jakarta (JKT)</option>
          <option value="BALI">Bali (BALI)</option>
          <option value="HCM">Ho Chi Minh (HCM)</option>
          <option value="CN">China (CN)</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">Quantity</label>
        <input type="text" id="eQty" placeholder="e.g. 400 units">
      </div>
    </div>
    <div class="fg">
      <label class="fl">Notes</label>
      <textarea id="eNotes" placeholder="Forwarder, AWB, PO ref..."></textarea>
    </div>
    <div class="ma">
      <button class="bdl" id="eDel" style="display:none" onclick="doDelete()">Delete</button>
      <button class="bcn" onclick="closeModal()">Cancel</button>
      <button class="bsv" id="eSave" onclick="doSave()">Save</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="ov" id="dModal">
  <div class="modal">
    <button class="mcl" onclick="closeDetail()">&#10005;</button>
    <div id="dContent"></div>
    <div class="ma">
      <button class="bdl" onclick="detailDelete()">Delete</button>
      <button class="bcn" onclick="closeDetail()">Close</button>
      <button class="bsv" onclick="detailEdit()">Edit</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG — paste your Apps Script deployment URL below ──────────────────
var API = 'https://script.google.com/macros/s/AKfycbyVjXKDSdkx-cyk6W7OLOuUbUAhQKKH6oAI5dl2imI2fsdLj5LjJ6IztVEXI5keRHAe/exec';
// ─────────────────────────────────────────────────────────────────────────────

var Y, M, events=[], editId=null, detailId=null;
var CATS={production:'Ready for Shipment',shipment:'Shipment / Arrival',purchasing:'Purchasing / PO',atrisk:'At Risk / Delayed'};
var COLORS={production:'#f97316',shipment:'#22d3a5',purchasing:'#a78bfa',atrisk:'#f43f5e'};
var BGS={production:'rgba(249,115,22,.13)',shipment:'rgba(34,211,165,.13)',purchasing:'rgba(167,139,250,.13)',atrisk:'rgba(244,63,94,.13)'};

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function p2(n){return String(n).padStart(2,'0')}
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function setSync(state, msg){
  var el=document.getElementById('syncStatus');
  el.textContent=msg;
  el.className='sync-status '+(state==='ok'?'sync-ok':state==='err'?'sync-err':'sync-load');
}

function setLoading(on){
  document.getElementById('loadingBar').style.width=on?'70%':'0';
}

// ── API calls ─────────────────────────────────────────────────────────────
function apiGet(cb){
  setLoading(true);
  setSync('load','syncing...');
  var url=API+'?action=get&_='+Date.now();
  fetch(url)
    .then(function(r){return r.json()})
    .then(function(data){
      setLoading(false);
      if(data.events){
        events=data.events;
        // cache locally as fallback
        try{localStorage.setItem('mck_cache',JSON.stringify(events))}catch(e){}
        setSync('ok','live ✓');
        cb && cb();
      } else {
        throw new Error(data.error||'bad response');
      }
    })
    .catch(function(err){
      setLoading(false);
      setSync('err','offline');
      // fallback to cache
      try{
        var c=localStorage.getItem('mck_cache');
        if(c){events=JSON.parse(c)}
      }catch(e){}
      cb && cb();
    });
}

function apiSave(ev, cb){
  setLoading(true);
  var url=API+'?action=save&event='+encodeURIComponent(JSON.stringify(ev));
  fetch(url)
    .then(function(r){return r.json()})
    .then(function(data){
      setLoading(false);
      if(data.ok){
        setSync('ok','saved ✓');
        setTimeout(function(){setSync('ok','live ✓')},2000);
        cb && cb(true);
      } else {
        throw new Error(data.error||'save failed');
      }
    })
    .catch(function(){
      setLoading(false);
      setSync('err','save failed');
      cb && cb(false);
    });
}

function apiDelete(id, cb){
  setLoading(true);
  var url=API+'?action=delete&id='+encodeURIComponent(id);
  fetch(url)
    .then(function(r){return r.json()})
    .then(function(data){
      setLoading(false);
      if(data.ok){
        setSync('ok','deleted ✓');
        setTimeout(function(){setSync('ok','live ✓')},2000);
        cb && cb(true);
      } else {
        throw new Error(data.error);
      }
    })
    .catch(function(){
      setLoading(false);
      setSync('err','delete failed');
      cb && cb(false);
    });
}

// ── Init & render ─────────────────────────────────────────────────────────
function getSeedEvents(){
  var y=2025,m='04';
  function dt(d){return y+'-'+m+'-'+(d<10?'0'+d:String(d))}
  return [
    {id:uid(),date:dt(5), category:'production', title:'1000 Gohan',        hub:'',    qty:'1000 units', notes:''},
    {id:uid(),date:dt(6), category:'shipment',   title:'100 MC JKT',        hub:'JKT', qty:'100 units',  notes:''},
    {id:uid(),date:dt(7), category:'shipment',   title:'300 MC MNL',        hub:'MNL', qty:'300 units',  notes:''},
    {id:uid(),date:dt(7), category:'purchasing',  title:'1000 CM5',          hub:'',    qty:'1000 units', notes:'PO with Julia / Armita.'},
    {id:uid(),date:dt(8), category:'shipment',   title:'100 MC JKT',        hub:'JKT', qty:'100 units',  notes:''},
    {id:uid(),date:dt(8), category:'shipment',   title:'300 SD 256 JKT',    hub:'JKT', qty:'300 units',  notes:''},
    {id:uid(),date:dt(8), category:'shipment',   title:'700 Power Banks JKT',hub:'JKT',qty:'700 units',  notes:''},
    {id:uid(),date:dt(9), category:'shipment',   title:'550 SD Card JKT',   hub:'JKT', qty:'550 units',  notes:''},
    {id:uid(),date:dt(10),category:'shipment',   title:'100 MC JKT',        hub:'JKT', qty:'100 units',  notes:''},
    {id:uid(),date:dt(10),category:'shipment',   title:'100 MC MNL',        hub:'MNL', qty:'100 units',  notes:''},
    {id:uid(),date:dt(10),category:'shipment',   title:'100 MC HCM',        hub:'HCM', qty:'100 units',  notes:''},
    {id:uid(),date:dt(13),category:'atrisk',     title:'100 WC to ?',       hub:'',    qty:'100 sets',   notes:'Wrist-cam destination TBD. QC backlog.'},
    {id:uid(),date:dt(19),category:'production', title:'1000 Naruto',        hub:'',    qty:'1000 units', notes:''}
  ];
}

function init(){
  var now=new Date();Y=now.getFullYear();M=now.getMonth();
  apiGet(function(){
    if(events.length===0){
      var seeds=getSeedEvents();
      seeds.forEach(function(ev){events.push(ev)});
      render();
      var i=0;
      function pushNext(){
        if(i>=seeds.length)return;
        apiSave(seeds[i],function(){i++;pushNext()});
      }
      pushNext();
    } else {
      render();
    }
  });
}

function changeMonth(d){
  M+=d;
  if(M>11){M=0;Y++}
  if(M<0){M=11;Y--}
  render();
}

function render(){
  var names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('monthLabel').textContent=names[M]+' '+Y;
  var g=document.getElementById('grid');g.innerHTML='';
  var first=new Date(Y,M,1).getDay();
  var dim=new Date(Y,M+1,0).getDate();
  var prev=new Date(Y,M,0).getDate();
  var today=new Date();
  for(var i=first-1;i>=0;i--){g.appendChild(makeCell(prev-i,Y,M-1,true))}
  for(var d=1;d<=dim;d++){
    var isTd=(today.getFullYear()===Y&&today.getMonth()===M&&today.getDate()===d);
    g.appendChild(makeCell(d,Y,M,false,isTd));
  }
  var tot=first+dim,rem=tot%7===0?0:7-(tot%7);
  for(var d=1;d<=rem;d++){g.appendChild(makeCell(d,Y,M+1,true))}
}

function makeCell(day,year,month,om,isTd){
  var cell=document.createElement('div');
  cell.className='dc'+(om?' om':'')+(isTd?' td':'');
  var dn=document.createElement('div');dn.className='dn';dn.textContent=day;cell.appendChild(dn);
  if(!om){
    var am=((month%12)+12)%12;
    var ay=month<0?year-1:(month>11?year+1:year);
    var ds=ay+'-'+p2(am+1)+'-'+p2(day);
    var evs=events.filter(function(e){return e.date===ds});
    evs.slice(0,3).forEach(function(ev){
      var c=document.createElement('div');
      c.className='chip '+ev.category;
      c.textContent=ev.title;
      c.title=ev.notes||ev.title;
      (function(id){c.onclick=function(e){e.stopPropagation();openDetail(id)}})(ev.id);
      cell.appendChild(c);
    });
    if(evs.length>3){
      var more=document.createElement('div');more.className='more';
      more.textContent='+'+(evs.length-3)+' more';
      (function(s){more.onclick=function(e){e.stopPropagation();openDayView(s)}})(ds);
      cell.appendChild(more);
    }
    (function(s,cnt){cell.onclick=function(){cnt>0?openDayView(s):openAdd(s)}})(ds,evs.length);
  }
  return cell;
}

// ── Day view ──────────────────────────────────────────────────────────────
function openDayView(ds){
  var evs=events.filter(function(e){return e.date===ds});
  var dt=new Date(ds+'T00:00:00');
  var dl=dt.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  document.getElementById('dayTitle').textContent=dl;
  document.getElementById('daySubtitle').textContent=evs.length+' event'+(evs.length!==1?'s':'')+' on this day';
  var list=document.getElementById('dayList');list.innerHTML='';
  evs.forEach(function(ev){
    var item=document.createElement('div');item.className='dev-item';
    item.innerHTML=
      '<div class="dev-left">'+
        '<div class="dev-title">'+escH(ev.title)+'</div>'+
        '<div class="dev-meta">'+
          '<span class="dev-tag" style="background:'+BGS[ev.category]+';color:'+COLORS[ev.category]+'">'+CATS[ev.category]+'</span>'+
          (ev.hub?'<span class="dev-pill">'+escH(ev.hub)+'</span>':'')+
          (ev.qty?'<span class="dev-pill">'+escH(ev.qty)+'</span>':'')+
        '</div>'+
        (ev.notes?'<div class="dev-notes">'+escH(ev.notes)+'</div>':'')+
      '</div>'+
      '<div class="dev-arrow">&#8250;</div>';
    (function(id){item.onclick=function(){closeDayView();openDetail(id)}})(ev.id);
    list.appendChild(item);
  });
  document.getElementById('dayAddBtn').onclick=function(){closeDayView();openAdd(ds)};
  document.getElementById('dayModal').classList.add('open');
}
function closeDayView(){document.getElementById('dayModal').classList.remove('open')}

// ── Add/Edit modal ────────────────────────────────────────────────────────
function openAdd(ds){
  editId=null;
  document.getElementById('eTitle').textContent='Add Event';
  document.getElementById('eDel').style.display='none';
  document.getElementById('eCat').value='shipment';
  document.getElementById('eLabel').value='';
  document.getElementById('eHub').value='';
  document.getElementById('eQty').value='';
  document.getElementById('eNotes').value='';
  if(!ds){var now=new Date();ds=now.getFullYear()+'-'+p2(now.getMonth()+1)+'-'+p2(now.getDate())}
  document.getElementById('eDate').value=ds;
  document.getElementById('eModal').classList.add('open');
}

function openEdit(id){
  var ev=null;
  for(var i=0;i<events.length;i++){if(events[i].id===id){ev=events[i];break}}
  if(!ev)return;
  editId=id;
  document.getElementById('eTitle').textContent='Edit Event';
  document.getElementById('eDel').style.display='block';
  document.getElementById('eDate').value=ev.date;
  document.getElementById('eCat').value=ev.category;
  document.getElementById('eLabel').value=ev.title;
  document.getElementById('eHub').value=ev.hub||'';
  document.getElementById('eQty').value=ev.qty||'';
  document.getElementById('eNotes').value=ev.notes||'';
  document.getElementById('eModal').classList.add('open');
}

function closeModal(){document.getElementById('eModal').classList.remove('open');editId=null}

function doSave(){
  var date=document.getElementById('eDate').value;
  var cat=document.getElementById('eCat').value;
  var title=document.getElementById('eLabel').value.trim();
  var hub=document.getElementById('eHub').value;
  var qty=document.getElementById('eQty').value.trim();
  var notes=document.getElementById('eNotes').value.trim();
  if(!date||!title){alert('Date and title required.');return}
  var ev={id:editId||uid(),date:date,category:cat,title:title,hub:hub,qty:qty,notes:notes};
  // Optimistic update
  if(editId){
    for(var i=0;i<events.length;i++){if(events[i].id===editId){events[i]=ev;break}}
  } else {
    events.push(ev);
  }
  closeModal();render();
  // Persist to sheet
  apiSave(ev, function(ok){if(!ok){alert('Saved locally but failed to sync to sheet. Check your connection.')}});
}

function doDelete(){
  if(!editId||!confirm('Delete this event?'))return;
  var id=editId;
  events=events.filter(function(e){return e.id!==id});
  closeModal();render();
  apiDelete(id, function(ok){if(!ok){alert('Deleted locally but failed to sync to sheet.')}});
}

// ── Detail modal ──────────────────────────────────────────────────────────
function openDetail(id){
  var ev=null;
  for(var i=0;i<events.length;i++){if(events[i].id===id){ev=events[i];break}}
  if(!ev)return;
  detailId=id;
  var dt=new Date(ev.date+'T00:00:00');
  var dl=dt.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
  document.getElementById('dContent').innerHTML=
    '<div class="dd">'+
    '<div class="dtag" style="background:'+BGS[ev.category]+';color:'+COLORS[ev.category]+'">'+CATS[ev.category]+'</div>'+
    '<div class="dtitle">'+escH(ev.title)+'</div>'+
    '<div class="drow"><div class="dkey">Date</div><div>'+dl+'</div></div>'+
    (ev.hub?'<div class="drow"><div class="dkey">Hub</div><div>'+escH(ev.hub)+'</div></div>':'')+
    (ev.qty?'<div class="drow"><div class="dkey">Qty</div><div>'+escH(ev.qty)+'</div></div>':'')+
    (ev.notes?'<div class="drow"><div class="dkey">Notes</div><div>'+escH(ev.notes)+'</div></div>':'')+
    '</div>';
  document.getElementById('dModal').classList.add('open');
}
function closeDetail(){document.getElementById('dModal').classList.remove('open');detailId=null}
function detailEdit(){var id=detailId;closeDetail();openEdit(id)}
function detailDelete(){
  if(!detailId||!confirm('Delete?'))return;
  var id=detailId;
  events=events.filter(function(e){return e.id!==id});
  closeDetail();render();
  apiDelete(id,function(){});
}

document.getElementById('dayModal').addEventListener('click',function(e){if(e.target===this)closeDayView()});
document.getElementById('eModal').addEventListener('click',function(e){if(e.target===this)closeModal()});
document.getElementById('dModal').addEventListener('click',function(e){if(e.target===this)closeDetail()});

init();
</script>
</body>
